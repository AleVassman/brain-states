<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brain States</title>
  </head>
  <body>
    <canvas id="stage" aria-label="3D brain. Drag to rotate, scroll to zoom, click a region to read about it."></canvas>

    <div id="labels" aria-hidden="true"></div>

    <div id="ui">
      <header class="top">
        <h1>Brain States</h1>
        <button id="about-open" type="button">About the science</button>
      </header>

      <aside class="panel left">
        <ul id="state-list"></ul>
        <label class="toggle" id="typical-label">
          <input type="checkbox" id="typical-toggle" />
          <span>Typical response</span>
        </label>
        <p class="hint" id="typical-note"></p>
        <label class="toggle">
          <input type="checkbox" id="labels-toggle" checked />
          <span>Name tags on the brain</span>
        </label>
      </aside>

      <aside class="panel right" id="side-panel" aria-live="polite"></aside>

      <footer class="bottom">
        <p id="banner" hidden></p>
        <p id="caption" aria-live="polite"></p>
        <div id="timeline"></div>
        <div class="legend">
          <span><span class="swatch up"></span>▲ more active than at rest</span>
          <span><span class="swatch down"></span>▼ less active (violet edge)</span>
          <span><span class="swatch hatch"></span>striped: evidence mixed or debated</span>
          <span><span class="swatch line"></span>pulsing line: working together more; dashed: less</span>
          <a class="help-link" href="https://findahelpline.com" target="_blank" rel="noopener noreferrer">If you're struggling</a>
        </div>
      </footer>
    </div>

    <dialog id="about"></dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
